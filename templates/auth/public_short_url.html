<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open a Short URL - LinkSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell">
  <div class="app-shell-inner">
    <section class="auth-area">
      <div id="screen-public" class="auth-card glass-panel">
        <div class="logo">
          <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="20" cy="20" r="15"/><ellipse cx="20" cy="20" rx="15" ry="6"/><path d="M20 5v30"/></svg>
          <span>LinkSphere</span>
        </div>
        <h1>Open a short URL</h1>
        <p class="sub">Open a link directly with its short code.</p>

        {% if error_message %}
          <div class="result-box" style="margin-bottom:14px;color:var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:12px;">
            {{ error_message }}
          </div>
        {% endif %}

        <form id="publicForm" method="POST" action="{{ url_for('public_resolver') }}">
          <div class="field">
            <label for="pubCode">Short URL or code</label>
            <input class="input" id="pubCode" name="code" type="text" placeholder="e.g. flask99 or https://lnk.sphere/flask99" value="{{ initial_code | default('') }}" required>
            <span class="hint">Enter the short code or complete short URL.</span>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%">Open Link</button>
        </form>

        <div class="auth-links">
          <a class="link-btn" href="{{ url_for('user_login') | default('#') }}">Back to User Login</a>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toast-area" id="toastArea" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
<script src="{{ url_for('static', filename='js/links.js') }}"></script>
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>

</body>
</html>
