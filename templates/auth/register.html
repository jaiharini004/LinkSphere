<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account - LinkSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app-shell">
  <div class="app-shell-inner">
    <section class="auth-area">
      <div id="screen-register" class="auth-card glass-panel">
        <div class="logo">
          <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="20" cy="20" r="15"/><ellipse cx="20" cy="20" rx="15" ry="6"/><path d="M20 5v30"/></svg>
          <span>LinkSphere</span>
        </div>
        <h1>Create account</h1>
        <p class="sub">Create an account to save and manage links.</p>

        <form id="registerForm" method="POST" action="{{ url_for('register') | default('#') }}" novalidate>
          <div class="field">
            <label for="rgName">Full name</label>
            <input class="input" id="rgName" name="name" type="text" autocomplete="name" value="{{ form_name | default('') }}">
          </div>
          <div class="field">
            <label for="rgEmail">Email</label>
            <input class="input" id="rgEmail" name="email" type="email" autocomplete="username" value="{{ form_email | default('') }}">
          </div>
          <div class="field">
            <label for="rgPassword">Password</label>
            <input class="input" id="rgPassword" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
          </div>
          <p class="form-error" id="rgError" role="alert">{{ error_message | default('') }}</p>
          <button class="btn btn-primary" type="submit" style="width:100%">Register</button>
        </form>

        <div class="auth-links">
          <a class="link-btn" href="{{ url_for('user_login') | default('#') }}" data-action="goAuth" data-screen="user-login">Back to User Login</a>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="toast-area" id="toastArea" aria-live="polite"></div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
<script src="{{ url_for('static', filename='js/links.js') }}"></script>
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>

</body>
</html>
